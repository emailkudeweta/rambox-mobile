<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WhatsApp Clone</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Roboto','sans-serif']},colors:{wa:{green:'#25D366',dark:'#128C7E',darker:'#075E54',text:'#111B21',subtext:'#667781',divider:'#F2F2F2',bubble:'#D9FDD3'}}}}}</script>
<style>
::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
body{-webkit-tap-highlight-color:transparent;user-select:none;background:#e9edef}
.tg{width:40px;height:22px;border-radius:11px;background:#c5cbd0;position:relative;flex-shrink:0;transition:.2s}
.tg:after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:#25D366}.tg.on:after{left:21px}
.anim{animation:sl .2s ease-out}@keyframes sl{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.pb{animation:pb 5s linear forwards}@keyframes pb{from{width:0}to{width:100%}}
.cbg{background:#EFEAE2 radial-gradient(#0000000d 1.5px,transparent 1.5px) 0 0/18px 18px}
.material-symbols-rounded{font-variation-settings:'wght' 300}
.ab:active{background:#F5F6F6}
</style></head>
<body class="h-screen w-screen overflow-hidden font-sans text-wa-text">
<div id="app" class="h-full w-full max-w-[430px] mx-auto bg-white flex flex-col relative overflow-hidden"></div>
<div id="pages"></div>
<div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-[#323232] text-white text-[14px] px-4 py-2 rounded-lg opacity-0 transition-opacity pointer-events-none" style="z-index:9999"></div>
<script>
const $=(s,e=document)=>e.querySelector(s);
const ic=(n,c='',s='')=>`<span class="material-symbols-rounded ${c}" style="${s}">${n}</span>`;
const FI="font-variation-settings:'FILL' 1";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>new Date().toTimeString().slice(0,5);
const COL=['#5B8DEF','#E0658A','#F2994A','#27AE9C','#9B6DFF','#C9A400','#2D9CDB','#EB5757'];
const WP=['#EFEAE2','#DCEBDD','#E3E9F5','#F3E2E2','#CFD8DC'];
let z=50,tab=0,flt=0,sel=new Set(),lpf=0,wp=WP[0],PCB,me={n:'Capaya',a:'Sibuk'};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,1800)};
const T=t=>()=>toast(t);
const M=(x,o,t,k)=>({x,o,t,k});
const C=[
{n:'Sayang 💖',t:'15:32',l:'Mengetik...',ty:1,u:2,pin:1,fav:1,m:[M('Halo, lagi sibuk gak?',0,'15:30'),M('Nggak kok, kenapa sayang? 😊',1,'15:31')]},
{n:'Keluarga Bahagia',t:'Kemarin',l:'Bapak: Assalamualaikum, jangan lupa sholat ya.',g:1,u:0,m:[M('Assalamualaikum, jangan lupa sholat ya.',0,'18:02')]},
{n:'Budi Kantor',t:'Senin',l:'Laporan bulan lalu udah dikirim bro. Thanks!',ck:1,u:0,m:[M('Laporan bulan lalu udah dikirim bro. Thanks!',1,'09:10')]},
{n:'Andi Developer',t:'28/09',l:'Deploy sudah selesai ya',u:0,fav:1,m:[M('Deploy sudah selesai ya',0,'21:14')]},
{n:'Dina HRD',t:'27/09',l:'Slip gaji sudah dikirim ke email',u:0,m:[M('Slip gaji sudah dikirim ke email',0,'10:00')]},
{n:'Toko Online Grup',g:1,a:1,u:0,t:'20/09',l:'Admin: Stok baru sudah masuk',m:[M('Stok baru sudah masuk',0,'12:00')]},
{n:'Pengumuman',g:1,h:1,u:0,t:'28/09',l:'Kerja bakti hari minggu pagi ya bapak-bapak.',m:[M('Kerja bakti hari minggu pagi ya bapak-bapak.',0,'07:00')]},
{n:'Meta AI',ai:1,x:1,u:0,l:'',m:[M('Halo! Saya Meta AI. Ada yang bisa saya bantu?',0,'09:00')]}];
const REP=['Oke siap 👍','Hahaha iya','Nanti aku kabari ya','Sebentar ya, lagi di jalan','Mantap!','Boleh, jam berapa?'];
const REPAI=['Tentu, ini jawaban singkat untuk pertanyaanmu ✨','Menarik! Bisa jelaskan lebih detail?','Berikut beberapa ide yang bisa kamu coba.'];
const calls=[[0,'in-miss','Kemarin, 19:30',0],[1,'in','28 September, 08:00',1],[2,'out','27 September, 14:12',0],[3,'in','26 September, 09:45',0]];
const ST=[{n:'Sayang 💖',txt:'Lagi di pantai 🏖️',bg:'linear-gradient(135deg,#f6d365,#fda085)',t:'10:12'},{n:'Andi Developer',txt:'Ship it! 🚀',bg:'linear-gradient(135deg,#43cea2,#185a9d)',t:'08:40'},{n:'Budi Kantor',txt:'Senin lagi...',bg:'#5B4B8A',t:'Kemarin',seen:1}];
const MS=[],G={ST,MS};
const BGS=['linear-gradient(135deg,#f6d365,#fda085)','linear-gradient(135deg,#43cea2,#185a9d)','linear-gradient(135deg,#a18cd1,#fbc2eb)','#075E54','#5B4B8A'];
const CH=[{n:'WhatsApp',t:'09:12',f:1,p:['Cari tahu fitur terbaru kami hari ini!','Kini Anda bisa membuat polling di chat.']},{n:'Info Teknologi',t:'Kemarin',f:1,p:['Chip terbaru resmi diumumkan']},{n:'Berita Pagi',t:'Senin',f:1,p:['Ringkasan berita hari ini']},{n:'Resep Nusantara',t:'',f:0,p:['Nasi goreng kampung ala rumahan']},{n:'Sepak Bola ID',t:'',f:0,p:['Skor akhir: 2-1']}].map(c=>(c.ch=1,c));
const COM=[{n:'Warga RT 01 / RW 02'}];
const EMO='😀😃😄😁😆😅😂🤣😊😇🙂😉😍🥰😘😋😎🤩🥳😏😒😞😔😢😭😤😡🤯😱🤔🤗🙄😴👍👎👏🙏💪👌✌️🤝❤️💖💔🔥✨🎉🎂🌹☕🍕🍔🍜🚗✈️📷💻📱'.match(/\p{Extended_Pictographic}\uFE0F?/gu);

/* ---------- util ---------- */
const av=(c,s=50)=>{const g=c.g||c.ch;return `<div style="width:${s}px;height:${s}px;background:${g?'#DFE5E7':COL[[...c.n][0].charCodeAt(0)%8]}" class="rounded-full flex items-center justify-center shrink-0 ${g?'text-wa-subtext':'text-white'}">${c.g?ic('groups','',`font-size:${s*.55}px`):c.ch?ic('campaign','',`font-size:${s*.55}px`):`<span style="font-size:${s*.44}px">${[...c.n][0]}</span>`}</div>`};
function page(html,cls='bg-white'){const d=document.createElement('div');d.className=`fixed inset-y-0 left-0 right-0 mx-auto max-w-[430px] flex flex-col ${cls} anim`;d.style.zIndex=++z;d.innerHTML=html;$('#pages').appendChild(d);d.close=()=>{d.remove();z--};return d}
const back=()=>{const p=$('#pages').lastElementChild;p&&p.close()};
const ib=(n,a='')=>`<div ${a} class="w-10 h-10 rounded-full flex items-center justify-center active:bg-gray-100 shrink-0">${ic(n,'text-[24px]')}</div>`;
const hdr=(t,r='',s='')=>`<header class="h-[60px] flex items-center px-2 bg-white shrink-0 shadow-sm">${ib('arrow_back','onclick="back()"')}<div class="ml-2 flex-1 min-w-0"><h1 class="text-[20px] leading-tight truncate">${t}</h1>${s?`<p class="text-[13px] text-wa-subtext leading-tight">${s}</p>`:''}</div>${r}</header>`;
function menu(items,pos='top-[52px] right-2'){closeMenu();const m=document.createElement('div');m.id='pm';m.className='fixed inset-0';m.style.zIndex=999;m.innerHTML=`<div class="relative h-full max-w-[430px] mx-auto"><div class="absolute ${pos} w-[225px] bg-white rounded-xl shadow-[0_4px_20px_rgba(0,0,0,.2)] py-2">${items.map((x,i)=>`<div data-i="${i}" class="px-4 py-2.5 text-[15px] active:bg-[#EAEBEE]">${x[0]}</div>`).join('')}</div></div>`;m.onclick=e=>{const i=e.target.dataset.i;closeMenu();if(i!=null)items[i][1]()};document.body.appendChild(m)}
const closeMenu=()=>{const m=$('#pm');m&&m.remove()};
function sheet(html){const s=document.createElement('div');s.style.zIndex=999;s.className='fixed inset-0 bg-black/40 flex items-end';s.onclick=e=>{if(e.target===s)s.remove()};s.innerHTML=`<div class="w-full max-w-[430px] mx-auto bg-white rounded-t-3xl p-5 anim">${html}</div>`;document.body.appendChild(s);return s}
function dlg(t,o,cur,cb){const s=document.createElement('div');s.style.zIndex=1000;s.className='fixed inset-0 bg-black/40 flex items-center justify-center p-8';s.innerHTML=`<div class="bg-white rounded-3xl w-full max-w-[380px] p-6"><h3 class="text-[19px] mb-3">${t}</h3>${o.map((x,i)=>`<div data-i="${i}" class="flex items-center py-2.5"><div class="w-5 h-5 rounded-full border-2 ${x==cur?'border-wa-green':'border-gray-400'} flex items-center justify-center mr-4">${x==cur?'<div class="w-2.5 h-2.5 rounded-full bg-wa-green"></div>':''}</div><span class="text-[16px]">${x}</span></div>`).join('')}<div class="text-right mt-3"><span class="text-wa-dark font-medium p-2" id="dc">Batal</span></div></div>`;s.onclick=e=>{const r=e.target.closest('[data-i]');if(r){cb(o[r.dataset.i]);s.remove()}else if(e.target===s||e.target.id=='dc')s.remove()};document.body.appendChild(s)}
function ask(t,v,cb){const s=document.createElement('div');s.style.zIndex=1000;s.className='fixed inset-0 bg-black/40 flex items-center justify-center p-8';s.innerHTML=`<div class="bg-white rounded-3xl w-full max-w-[380px] p-6"><h3 class="text-[19px] mb-3">${t}</h3><input value="${esc(v)}" class="w-full border-b-2 border-wa-green outline-none py-2 text-[16px]" style="user-select:text"><div class="text-right mt-5 space-x-6 text-wa-dark font-medium"><span id="dc">Batal</span><span id="ok">Simpan</span></div></div>`;s.onclick=e=>{if(e.target.id=='ok'){const x=$('input',s).value.trim();if(x){cb(x);s.remove()}}else if(e.target===s||e.target.id=='dc')s.remove()};document.body.appendChild(s);$('input',s).focus()}
const rowUI=(t,s='',tg,icon='',cls='')=>`<div onclick="rc(this)" class="flex items-center px-5 py-3.5 ab ${cls}">${icon?`<div class="w-[36px] shrink-0 text-gray-600">${ic(icon,'text-[22px]')}</div>`:''}<div class="flex-1 pr-3"><h3 class="text-[16px]">${t}</h3>${s?`<p class="text-[13px] text-wa-subtext mt-[1px]">${s}</p>`:''}</div>${tg!=null?`<div class="tg ${tg?'on':''}"></div>`:''}</div>`;
const rc=el=>{const g=$('.tg',el);g?g.classList.toggle('on'):toast($('h3',el).textContent)};
const fab=(icon,a,cls='bottom-6 right-4')=>`<button ${a?`onclick="${a}"`:''} class="absolute ${cls} w-[56px] h-[56px] bg-wa-green text-white rounded-[16px] shadow-[0_4px_12px_rgba(0,0,0,.2)] flex items-center justify-center active:bg-wa-dark z-20">${ic(icon,'text-[26px]')}</button>`;
const lab=m=>({v:'🎤 Pesan suara',img:'📷 Foto',doc:'📄 '+m.x,loc:'📍 Lokasi',ct:'👤 Kontak',poll:'📊 Poll'}[m.k]||m.x);

/* ---------- home ---------- */
const ci=()=>C.map((c,i)=>[c,i]);
const chatRow=(c,i)=>{const s=sel.has(i);return `<div data-c="${i}" onclick="cr(${i})" class="flex items-center px-4 py-3 ab ${s?'bg-[#E9F5EE]':''}"><div class="relative">${av(c)}${s?`<div class="absolute -bottom-0.5 -right-0.5 w-5 h-5 bg-wa-green rounded-full border-2 border-white text-white flex items-center justify-center">${ic('check','text-[14px]')}</div>`:''}</div><div class="ml-3.5 flex-1 min-w-0"><div class="flex justify-between items-center"><h3 class="text-[16px] ${c.u?'font-medium':''} truncate">${c.n}</h3><span class="text-[12px] ${c.u?'text-wa-green font-medium':'text-wa-subtext'}">${c.t||''}</span></div><div class="flex justify-between items-center mt-[1px]"><p class="text-[14px] truncate flex items-center ${c.ty?'text-wa-green font-medium':'text-wa-subtext'}">${c.ck&&!c.ty?ic('done_all','text-[#34B7F1] text-[18px] mr-1'):''}<span class="truncate">${c.ty?'Mengetik...':esc(c.l)}</span></p><div class="flex items-center space-x-1.5 pl-2">${c.mu?ic('volume_off','text-wa-subtext text-[16px]'):''}${c.pin?ic('push_pin','text-wa-subtext text-[18px] rotate-45'):''}${c.u?`<div class="bg-wa-green text-white text-[11px] font-bold rounded-full min-w-[20px] h-5 px-1 flex items-center justify-center">${c.u}</div>`:''}</div></div></div></div>`};
function cr(i){if(lpf){lpf=0;return}if(sel.size){sel.has(i)?sel.delete(i):sel.add(i);render()}else openChat(i)}
function chatsTab(){
 const L=ci().filter(([x])=>!x.a&&!x.h&&!x.x&&[1,x.u>0,x.fav,x.g][flt]).sort((a,b)=>(b[0].pin||0)-(a[0].pin||0));
 const na=C.filter(x=>x.a).length;
 return `<div class="px-4 py-1"><div onclick="openSearch()" class="bg-[#F5F6F6] h-[48px] rounded-full flex items-center px-4"><svg viewBox="0 0 24 24" width="22" height="22"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3385FF"/><stop offset=".5" stop-color="#9933FF"/><stop offset="1" stop-color="#FF3399"/></linearGradient></defs><circle cx="12" cy="12" r="8.5" fill="none" stroke="url(#g)" stroke-width="2.5"/></svg><span class="ml-3 text-wa-subtext text-[15px]">Tanyakan ke Meta AI atau Cari</span></div></div>
 <div class="px-4 py-2 pb-3 flex space-x-2 overflow-x-auto no-scrollbar">${['Semua','Belum dibaca','Favorit','Grup'].map((f,i)=>`<button onclick="flt=${i};render()" class="px-4 py-1.5 rounded-full text-[14px] font-medium whitespace-nowrap ${i==flt?'bg-[#D8FDD2] text-[#0f5132]':'bg-[#F5F6F6] text-wa-subtext'}">${f}</button>`).join('')}<button onclick="ask('Daftar baru','',n=>toast('Daftar '+n+' dibuat'))" class="px-3 py-1.5 rounded-full bg-[#F5F6F6] text-wa-subtext">${ic('add','text-[18px]')}</button></div>
 ${na?`<div onclick="openArchive()" class="flex items-center px-4 py-3 ab"><div class="w-[50px] flex justify-center text-wa-subtext">${ic('archive','text-[24px]')}</div><h3 class="ml-3.5 flex-1 font-medium text-[16px]">Diarsipkan</h3><span class="text-wa-green text-[12px] font-medium">${na}</span></div>`:''}
 ${L.length?L.map(([x,i])=>chatRow(x,i)).join(''):`<p class="text-center text-wa-subtext py-16 px-8">Tidak ada chat untuk filter ini</p>`}
 <div class="py-8 text-center text-wa-subtext text-[12px] flex justify-center items-center">${ic('lock','text-[14px] mr-1')}Pesan Anda <span class="text-wa-green font-medium ml-1">terenkripsi secara end-to-end</span></div>`}
const ring=(o,i,a)=>`<div onclick="vs('${a}',${i})" class="flex flex-col items-center space-y-1.5 shrink-0"><div class="w-[62px] h-[62px] rounded-full p-[2.5px] border-[2.5px] ${o.seen?'border-gray-300':'border-wa-green'}">${av({n:o.n},52)}</div><span class="text-[13px] font-medium ${o.seen?'text-wa-subtext':''} max-w-[70px] truncate">${o.n}</span></div>`;
function updatesTab(){
 return `<div class="px-4 py-3"><h2 class="text-[19px] font-medium">Status</h2></div>
 <div class="flex space-x-4 px-4 py-2 overflow-x-auto no-scrollbar"><div class="flex flex-col items-center space-y-1.5 shrink-0"><div class="relative w-[62px] h-[62px]" onclick="${MS.length?`vs('MS',${MS.length-1})`:'stText()'}">${av({n:me.n},62)}<div onclick="event.stopPropagation();stText()" class="absolute bottom-0 right-0 bg-wa-green text-white rounded-full w-6 h-6 flex items-center justify-center border-[2.5px] border-white">${ic('add','text-[16px]')}</div></div><span class="text-[13px] font-medium">Status saya</span></div>
 ${ST.map((s,i)=>ring(s,i,'ST')).join('')}</div>
 <hr class="mx-4 my-2 border-wa-divider"><div class="px-4 py-3 flex justify-between"><h2 class="text-[19px] font-medium">Saluran</h2><span onclick="explore()" class="text-wa-green font-medium text-[14px]">Jelajahi</span></div>
 ${CH.map((c,i)=>c.f?`<div onclick="chPage(${i})" class="flex items-center px-4 py-3 ab">${av(c)}<div class="ml-3.5 flex-1 min-w-0"><div class="flex justify-between"><h3 class="font-medium text-[16px]">${c.n}</h3><span class="text-wa-subtext text-[12px]">${c.t}</span></div><p class="text-wa-subtext text-[14px] truncate">${c.p[c.p.length-1]}</p></div></div>`:'').join('')}
 <div class="py-6 text-center"><button onclick="explore()" class="bg-[#D8FDD2] text-[#0f5132] px-6 py-2 rounded-full text-[14px] font-medium">Cari saluran</button></div>`}
function commTab(){const pg=C.findIndex(x=>x.h);
 return `<div onclick="comIntro()" class="flex items-center px-4 py-4 ab"><div class="w-[50px] h-[50px] rounded-xl bg-gray-200 flex items-center justify-center relative text-gray-500">${ic('groups','text-[32px]')}<div class="absolute -bottom-1 -right-1 bg-wa-green text-white rounded-full w-[22px] h-[22px] flex items-center justify-center border-2 border-white">${ic('add','text-[16px]')}</div></div><h3 class="font-medium text-[16px] ml-3.5">Komunitas baru</h3></div><div class="h-2 bg-[#F5F6F6]"></div>
 ${COM.map((c,k)=>`<div class="flex items-center px-4 py-3 mt-2"><div class="w-[50px] h-[50px] rounded-xl bg-[#D8FDD2] flex items-center justify-center text-wa-dark">${ic('diversity_3','text-[28px]')}</div><h3 class="font-medium text-[16px] ml-3.5">${esc(c.n)}</h3></div>
 <div onclick="${k?"toast('Belum ada pengumuman')":`openChat(${pg})`}" class="flex items-center px-4 py-2 ab"><div class="w-[50px] flex justify-center"><div class="w-10 h-10 bg-[#E7FCE3] rounded-full flex items-center justify-center text-[#1DA750]">${ic('campaign','text-[22px]')}</div></div><div class="ml-3.5 flex-1 min-w-0"><div class="flex justify-between"><h3 class="font-medium text-[16px]">Pengumuman</h3><span class="text-wa-subtext text-[12px]">${k?'':'28/09'}</span></div><p class="text-wa-subtext text-[14px] truncate">${k?'Komunitas baru dibuat':C[pg].l}</p></div></div>
 ${k?'':`<div onclick="openChat(1)" class="flex items-center px-4 py-2 ab"><div class="w-[50px] flex justify-center">${av(C[1],40)}</div><h3 class="ml-3.5 text-[16px]">Keluarga Bahagia</h3></div>`}
 <div onclick="toast('Lihat semua grup')" class="flex items-center px-4 py-3 ab text-wa-subtext"><div class="w-[50px] flex justify-center">${ic('chevron_right','text-[24px]')}</div><span class="ml-3.5 text-[15px]">Lihat semua</span></div><div class="h-2 bg-[#F5F6F6]"></div>`).join('')}`}
function callsTab(){const fv=ci().filter(([c])=>c.fav);
 return `<div onclick="linkSheet()" class="flex items-center px-4 py-3 ab"><div class="w-[46px] h-[46px] rounded-full bg-[#D8FDD2] flex items-center justify-center text-wa-dark">${ic('link','text-[24px]')}</div><h3 class="font-medium text-[16px] ml-4">Buat tautan panggilan</h3></div>
 <div class="px-4 py-2"><h2 class="text-[16px] font-medium mb-2">Favorit</h2>${fv.map(([c,i])=>`<div onclick="callScreen(${i},0)" class="flex items-center py-2">${av(c,46)}<h3 class="ml-4 flex-1 text-[16px]">${c.n}</h3>${ic('call','text-[24px] text-wa-dark')}</div>`).join('')}<div onclick="pickContact('Tambah ke Favorit',i=>{C[i].fav=1;render();toast('Ditambahkan ke Favorit')})" class="flex items-center space-x-4 py-1"><div class="w-[46px] h-[46px] rounded-full bg-wa-green flex items-center justify-center text-white">${ic('favorite','text-[24px]')}</div><h3 class="font-medium text-[16px]">Tambah ke Favorit</h3></div></div>
 <div class="px-4 mt-2 mb-1"><h2 class="text-[16px] font-medium">Terbaru</h2></div>
 ${calls.map(([i,d,w,v])=>`<div onclick="callScreen(${i},${v})" class="flex items-center px-4 py-3 ab">${av(C[i])}<div class="ml-3.5 flex-1"><h3 class="font-medium text-[16px] ${d=='in-miss'?'text-red-500':''}">${C[i].n}</h3><div class="flex items-center text-wa-subtext text-[14px]">${ic(d=='in-miss'?'call_missed':d=='in'?'call_received':'call_made',(d=='in-miss'?'text-red-500':'text-wa-green')+' text-[18px] mr-1')}${w}</div></div>${ic(v?'videocam':'call','text-[26px]')}</div>`).join('')||'<p class="text-center text-wa-subtext py-10">Belum ada riwayat panggilan</p>'}`}
const TITLES=['WhatsApp','Pembaruan','Komunitas','Panggilan'];
function render(){
 const badge=C.reduce((a,c)=>a+(c.u>0&&!c.a&&!c.x?1:0),0);
