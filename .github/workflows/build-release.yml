name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Rename APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rambox-Mobile.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Rambox Mobile ${{ github.event.inputs.tag_name || github.ref_name }}
          body: |
            ### 🚀 Rambox Mobile Update
            - **Google Sign-In & OAuth**: Full support for Gmail, Google Drive, YouTube, and third-party Google OAuth logins.
            - **Draggable Dynamic Island**: Move and place the island anywhere on screen with persistent coordinates.
            - **Desktop-Parity Settings**: Full settings panel (General, Appearance, AdGuard DNS, App Data / Cache Cleaner).
            - **WhatsApp Web Responsive**: High-contrast, single-pane layout with camera QR scanner.
            - **Automated Over-The-Air (OTA) Updates**: In-app one-click update detection and installation.
          files: Rambox-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
